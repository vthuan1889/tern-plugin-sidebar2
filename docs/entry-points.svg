<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<text x="16" y="30" font-size="14" fill="#1f2328" font-weight="700" text-anchor="start">Show / hide — four entry points</text><rect x="16" y="44" width="208" height="164" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="30" y="68" font-size="12" fill="#1f2328" font-weight="700" text-anchor="start">Status bar</text><rect x="240" y="44" width="208" height="164" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="254" y="68" font-size="12" fill="#1f2328" font-weight="700" text-anchor="start">Files view button</text><rect x="464" y="44" width="208" height="164" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="478" y="68" font-size="12" fill="#1f2328" font-weight="700" text-anchor="start">Command palette</text><rect x="688" y="44" width="208" height="164" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="702" y="68" font-size="12" fill="#1f2328" font-weight="700" text-anchor="start">Keybind</text><rect x="30" y="82" width="180" height="28" rx="4" fill="#f6f8fa" stroke="#d8dee4" stroke-width="1"/><rect x="36" y="88" width="120" height="16" rx="4" fill="#ddf4ff"/><text x="96.0" y="99.6" font-size="9.5" fill="#0969da" font-weight="600" text-anchor="middle">▮ Kanban: ON · DOING</text><text x="30" y="132" font-size="10" fill="#1f2328" font-weight="400" text-anchor="start">Click the segment to toggle.</text><text x="30" y="149" font-size="10" fill="#1f2328" font-weight="400" text-anchor="start">When hidden it reads Kanban: OFF.</text><text x="30" y="166" font-size="10" fill="#59636e" font-weight="400" text-anchor="start">The plugin enables the status bar</text><text x="30" y="183" font-size="10" fill="#59636e" font-weight="400" text-anchor="start">setting so the toggle stays reachable.</text><rect x="254" y="82" width="180" height="28" rx="4" fill="#f6f8fa" stroke="#d8dee4" stroke-width="1"/><text x="264" y="101" font-size="13" fill="#0969da" font-weight="700" text-anchor="start">▤</text><text x="284" y="101" font-size="11" fill="#1f2328" font-weight="400" text-anchor="start">Kanban</text><text x="254" y="132" font-size="10" fill="#1f2328" font-weight="400" text-anchor="start">Kanban toggle button in the Files</text><text x="254" y="149" font-size="10" fill="#1f2328" font-weight="400" text-anchor="start">view toolbar. Tooltip shows the</text><text x="254" y="166" font-size="10" fill="#1f2328" font-weight="400" text-anchor="start">bound key.</text><rect x="478" y="82" width="180" height="18" rx="4" fill="#f6f8fa" stroke="#e4e8ed" stroke-width="1"/><text x="484" y="95" font-size="9.5" fill="#1f2328" font-weight="400" text-anchor="start">Kanban Sidebar: Show / Hide Toggle</text><rect x="478" y="102" width="180" height="18" rx="4" fill="#f6f8fa" stroke="#e4e8ed" stroke-width="1"/><text x="484" y="115" font-size="9.5" fill="#1f2328" font-weight="400" text-anchor="start">Kanban Sidebar: Show</text><rect x="478" y="122" width="180" height="18" rx="4" fill="#f6f8fa" stroke="#e4e8ed" stroke-width="1"/><text x="484" y="135" font-size="9.5" fill="#1f2328" font-weight="400" text-anchor="start">Kanban Sidebar: Hide</text><text x="478" y="158" font-size="10" fill="#1f2328" font-weight="400" text-anchor="start">Also: Switch Left / Right Side and</text><text x="478" y="175" font-size="10" fill="#1f2328" font-weight="400" text-anchor="start">Move Session to TODO / Processing</text><text x="478" y="192" font-size="10" fill="#1f2328" font-weight="400" text-anchor="start">/ DONE…</text><rect x="702" y="84" width="44" height="24" rx="5" fill="#f6f8fa" stroke="#d8dee4" stroke-width="1"/><text x="724.0" y="101" font-size="11" fill="#1f2328" font-weight="600" text-anchor="middle">Ctrl</text><rect x="750" y="84" width="16" height="24" rx="5" fill="#f6f8fa" stroke="#d8dee4" stroke-width="1"/><text x="758.0" y="101" font-size="11" fill="#1f2328" font-weight="600" text-anchor="middle">+</text><rect x="772" y="84" width="40" height="24" rx="5" fill="#f6f8fa" stroke="#d8dee4" stroke-width="1"/><text x="792.0" y="101" font-size="11" fill="#1f2328" font-weight="600" text-anchor="middle">Alt</text><rect x="816" y="84" width="16" height="24" rx="5" fill="#f6f8fa" stroke="#d8dee4" stroke-width="1"/><text x="824.0" y="101" font-size="11" fill="#1f2328" font-weight="600" text-anchor="middle">+</text><rect x="836" y="84" width="30" height="24" rx="5" fill="#f6f8fa" stroke="#d8dee4" stroke-width="1"/><text x="851.0" y="101" font-size="11" fill="#1f2328" font-weight="600" text-anchor="middle">B</text><text x="702" y="132" font-size="10.5" fill="#1f2328" font-weight="400" text-anchor="start">Cmd + Alt + B on macOS.</text><text x="702" y="152" font-size="10" fill="#59636e" font-weight="400" text-anchor="start">Bound at window start; works from</text><text x="702" y="169" font-size="10" fill="#59636e" font-weight="400" text-anchor="start">any focused pane, terminal or</text><text x="702" y="186" font-size="10" fill="#59636e" font-weight="400" text-anchor="start">canvas.</text><text x="16" y="240" font-size="11" fill="#59636e" font-weight="400" text-anchor="start">Install once with  tern plugin install github.com/vthuan1889/tern-plugin-sidebar2  — then reload with  tern plugin reload sidebar2.</text>
</svg>
