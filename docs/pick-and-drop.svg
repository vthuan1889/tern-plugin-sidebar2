<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<text x="20" y="32" font-size="13" fill="#1f2328" font-weight="700" text-anchor="start">1 · Pick a session, then a column</text><text x="396" y="32" font-size="13" fill="#1f2328" font-weight="700" text-anchor="start">2 · Dropped into PROCESSING</text><rect x="20" y="44" width="264" height="368" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="396" y="44" width="264" height="368" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="28" y="54" width="248" height="26" rx="6" fill="#f0f7ff" stroke="#0969da" stroke-width="1" stroke-dasharray="4 3"/><text x="36" y="71" font-size="10.5" fill="#0969da" font-weight="800" text-anchor="start">⇄ Move:</text><text x="88" y="71" font-size="10.5" fill="#1f2328" font-weight="600" text-anchor="start">local / api-server</text><rect x="226" y="58" width="44" height="18" rx="4" fill="#eaeef2"/><text x="248.0" y="70.6" font-size="9.5" fill="#59636e" font-weight="600" text-anchor="middle">Cancel ✕</text><rect x="28" y="88" width="248" height="104" rx="7" fill="#fbfcfd" stroke="#d8dee4" stroke-width="1"/><text x="36" y="106" font-size="11.5" fill="#0969da" font-weight="700" text-anchor="start">TODO</text><rect x="192" y="94" width="76" height="16" rx="4" fill="#ddf4ff"/><text x="230.0" y="105.6" font-size="9" fill="#0969da" font-weight="600" text-anchor="middle">↓ Drop here</text><rect x="32" y="114" width="240" height="22" rx="0" fill="#fff8c5"/><rect x="32" y="114" width="3" height="22" rx="0" fill="#9a6700"/><rect x="38" y="117" width="16" height="16" rx="4" fill="#fff8c5"/><text x="46.0" y="128.6" font-size="9.5" fill="#9a6700" font-weight="600" text-anchor="middle">🎯</text><rect x="58" y="118" width="38" height="14" rx="4" fill="#eaeef2"/><text x="77.0" y="128.6" font-size="9" fill="#59636e" font-weight="600" text-anchor="middle">local</text><text x="102" y="129" font-size="11" fill="#1f2328" font-weight="600" text-anchor="start">api-server</text><text x="166" y="129" font-size="10" fill="#59636e" font-weight="400" text-anchor="start">2t</text><rect x="36" y="140" width="232" height="20" rx="5" fill="#f2f8ff" stroke="#0969da" stroke-width="1" stroke-dasharray="4 3"/><text x="152.0" y="153.5" font-size="9.5" fill="#0969da" font-weight="600" text-anchor="middle">↓ Move session to TODO</text><rect x="28" y="200" width="248" height="92" rx="7" fill="#fbfcfd" stroke="#d8dee4" stroke-width="1"/><text x="36" y="218" font-size="10.5" fill="#9a6700" font-weight="700" text-anchor="start">PROCESSING</text><rect x="192" y="206" width="76" height="16" rx="4" fill="#fff8c5"/><text x="230.0" y="217.6" font-size="9" fill="#9a6700" font-weight="600" text-anchor="middle">↓ Drop here</text><rect x="36" y="226" width="232" height="20" rx="5" fill="#f2f8ff" stroke="#0969da" stroke-width="1" stroke-dasharray="4 3"/><text x="152.0" y="239.5" font-size="9.5" fill="#9a6700" font-weight="600" text-anchor="middle">↓ Move session to PROCESSING</text><rect x="28" y="300" width="248" height="72" rx="7" fill="#fbfcfd" stroke="#d8dee4" stroke-width="1"/><text x="36" y="318" font-size="11.5" fill="#1a7f37" font-weight="700" text-anchor="start">DONE</text><rect x="192" y="306" width="76" height="16" rx="4" fill="#dafbe1"/><text x="230.0" y="317.6" font-size="9" fill="#1a7f37" font-weight="600" text-anchor="middle">↓ Drop here</text><rect x="36" y="326" width="232" height="20" rx="5" fill="#f2f8ff" stroke="#0969da" stroke-width="1" stroke-dasharray="4 3"/><text x="152.0" y="339.5" font-size="9.5" fill="#1a7f37" font-weight="600" text-anchor="middle">↓ Move session to DONE</text><line x1="292" y1="250" x2="382" y2="250" stroke="#0969da" stroke-width="1.5"/><path d="M382 250 L374 245.5 L374 254.5 Z" fill="#0969da"/><text x="337" y="240" font-size="10" fill="#59636e" font-weight="600" text-anchor="middle">click a drop zone</text><rect x="404" y="54" width="248" height="72" rx="7" fill="#fbfcfd" stroke="#d8dee4" stroke-width="1"/><text x="412" y="72" font-size="11.5" fill="#0969da" font-weight="700" text-anchor="start">TODO</text><text x="412" y="104" font-size="10.5" fill="#59636e" font-weight="400" text-anchor="start">No sessions in TODO</text><rect x="404" y="134" width="248" height="92" rx="7" fill="#fbfcfd" stroke="#d8dee4" stroke-width="1"/><text x="412" y="152" font-size="10.5" fill="#9a6700" font-weight="700" text-anchor="start">PROCESSING</text><rect x="408" y="162" width="240" height="22" rx="0" fill="#f0f6ff"/><rect x="408" y="162" width="3" height="22" rx="0" fill="#0969da"/><rect x="414" y="165" width="16" height="16" rx="4" fill="#eaeef2"/><text x="422.0" y="176.6" font-size="9.5" fill="#59636e" font-weight="600" text-anchor="middle">⠿</text><rect x="434" y="166" width="38" height="14" rx="4" fill="#eaeef2"/><text x="453.0" y="176.6" font-size="9" fill="#59636e" font-weight="600" text-anchor="middle">local</text><text x="478" y="177" font-size="11" fill="#1f2328" font-weight="600" text-anchor="start">api-server</text><text x="542" y="177" font-size="10" fill="#59636e" font-weight="400" text-anchor="start">2t</text><rect x="586" y="166" width="56" height="14" rx="4" fill="#dafbe1"/><text x="614.0" y="176.6" font-size="9" fill="#1a7f37" font-weight="600" text-anchor="middle">moved ✓</text><rect x="404" y="234" width="248" height="72" rx="7" fill="#fbfcfd" stroke="#d8dee4" stroke-width="1"/><text x="412" y="252" font-size="11.5" fill="#1a7f37" font-weight="700" text-anchor="start">DONE</text><text x="412" y="284" font-size="10.5" fill="#59636e" font-weight="400" text-anchor="start">No sessions in DONE</text><text x="690" y="60" font-size="12" fill="#1f2328" font-weight="700" text-anchor="start">Three ways to move</text><text x="690" y="82" font-size="10.5" fill="#1f2328" font-weight="400" text-anchor="start">1. Click ⠿ grip, then a target column</text><text x="690" y="100" font-size="10.5" fill="#1f2328" font-weight="400" text-anchor="start">2. Right-click the session → Move to …</text><text x="690" y="118" font-size="10.5" fill="#1f2328" font-weight="400" text-anchor="start">3. Dock → Move… → pick a session</text><text x="690" y="152" font-size="10.5" fill="#59636e" font-weight="400" text-anchor="start">Manual moves stick. A session is</text><text x="690" y="168" font-size="10.5" fill="#59636e" font-weight="400" text-anchor="start">auto-promoted TODO → PROCESSING</text><text x="690" y="184" font-size="10.5" fill="#59636e" font-weight="400" text-anchor="start">only while you never moved it, and</text><text x="690" y="200" font-size="10.5" fill="#59636e" font-weight="400" text-anchor="start">never past PROCESSING.</text><text x="20" y="438" font-size="11" fill="#1f2328" font-weight="400" text-anchor="start">Tabs use the same flow: click ⠿ on a tab (shown when the session has 2+ tabs), then click ⠿ on the tab it should precede.</text><text x="20" y="456" font-size="11" fill="#59636e" font-weight="400" text-anchor="start">The tab menu also offers ← / → (move one position), Rename and Close.</text>
</svg>
